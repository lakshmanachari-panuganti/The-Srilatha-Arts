name: Deploy Backend · PRD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend-prd.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend-prd
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  WORKING_DIRECTORY: backend
  AZURE_FUNCTIONAPP_NAME: func-thesrilathaarts-prd
  AZURE_RESOURCE_GROUP: rg-thesrilathaarts-prd
  AZURE_STORAGE_ACCOUNT: stthesrilathaartsprd
  FALLBACK_BLOB_CONTAINER: function-releases

jobs:
  build-and-deploy:
    name: Build & Deploy BackEnd - Prd
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      id-token: write   # required for azure/login OIDC token exchange

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
          lfs: false

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          npm run build
          npm prune --omit=dev

      - name: Package backend as zip
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: zip -r -q "$RUNNER_TEMP/deploy.zip" . -x ".git/*" ".github/*"

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_PRD }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure RunFromPackage=1 (auto-correct if drifted)
        # Happy path: no-op read (WEBSITE_RUN_FROM_PACKAGE already '1').
        # Drift path: reset to '1' then poll /api/health until the restart
        # is confirmed before ZipDeploy runs. A fixed sleep was insufficient
        # (root cause of 409 Conflict on ZipDeploy after drift-correction).
        run: |
          set -euo pipefail
          CURRENT=$(az functionapp config appsettings list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_FUNCTIONAPP_NAME" \
            --query "[?name=='WEBSITE_RUN_FROM_PACKAGE'].value | [0]" \
            --output tsv)
          if [ "$CURRENT" = "1" ]; then
            echo "WEBSITE_RUN_FROM_PACKAGE=1 verified (no write needed)."
          else
            echo "WEBSITE_RUN_FROM_PACKAGE is '$CURRENT' — auto-correcting to '1' (triggers restart)"
            az functionapp config appsettings set \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_FUNCTIONAPP_NAME" \
              --settings "WEBSITE_RUN_FROM_PACKAGE=1" \
              --output none
            echo "Polling /api/health until restart completes (up to 300s)..."
            SETTLED=false
            for i in $(seq 1 20); do
              sleep 15
              CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                "https://${AZURE_FUNCTIONAPP_NAME}.azurewebsites.net/api/health" 2>/dev/null || echo "000")
              echo "  t+$((i*15))s → /api/health = $CODE"
              if [ "$CODE" = "200" ]; then SETTLED=true; break; fi
            done
            $SETTLED || echo "::warning::App did not return 200 within 300s — ZipDeploy may still fail"
          fi

      - name: Deploy to Azure Functions (Kudu ZipDeploy via AAD/OIDC)
        # PRIMARY path — the canonical config-zip deploy that everyone
        # expects. Uses the Kudu ZipDeploy endpoint at
        # {name}.scm.azurewebsites.net/api/zipdeploy over the AAD token
        # from OIDC login (no SCM basic auth, no publish profile).
        # Requires the CI SP's `Website Contributor` role on the FA.
        #
        # Retry with exponential backoff on transient SCM failures.
        # `continue-on-error: true` because the SAS-URL fallback below
        # is the safety net when SCM is genuinely stuck (observed on DEV
        # 2026-07-19 with SCM 503 for hours). Workflow only fails if
        # BOTH paths fail (enforced by the final Verify deploy step).
        id: primary_deploy
        continue-on-error: true
        run: |
          set -euo pipefail
          attempt=1
          max_attempts=3
          delay=5
          while :; do
            echo "Deploy attempt $attempt of $max_attempts..."
            if az functionapp deployment source config-zip \
                 --resource-group "$AZURE_RESOURCE_GROUP" \
                 --name "$AZURE_FUNCTIONAPP_NAME" \
                 --src "$RUNNER_TEMP/deploy.zip"; then
              echo "Primary deploy succeeded on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::warning::Primary deploy failed after $max_attempts attempts — falling back to SAS-URL path"
              exit 1
            fi
            echo "Attempt $attempt failed; sleeping ${delay}s before retry..."
            sleep "$delay"
            delay=$((delay * 6))
            attempt=$((attempt + 1))
          done

      - name: Fallback deploy via WEBSITE_RUN_FROM_PACKAGE=<blob URL>
        # FALLBACK path — runs only if primary retries all failed.
        # Bypasses Kudu entirely: uploads the zip to blob storage and sets
        # WEBSITE_RUN_FROM_PACKAGE to the plain blob URL. The function app's
        # system-assigned managed identity (Storage Blob Data Owner on
        # stthesrilathaartsprd) authenticates the download — no SAS token,
        # no expiry, no secrets in app settings or CI logs.
        #
        # After this fires, WEBSITE_RUN_FROM_PACKAGE is a blob URL (not '1').
        # The next run's "Ensure RunFromPackage=1" step above auto-corrects
        # it back once SCM is stable.
        id: fallback_deploy
        if: steps.primary_deploy.outcome == 'failure'
        run: |
          set -euo pipefail
          BLOB_NAME="ci-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA:0:7}.zip"
          echo "Uploading zip to blob: $BLOB_NAME"
          az storage blob upload \
            --account-name "$AZURE_STORAGE_ACCOUNT" \
            --container-name "$FALLBACK_BLOB_CONTAINER" \
            --file "$RUNNER_TEMP/deploy.zip" \
            --name "$BLOB_NAME" \
            --auth-mode login \
            --overwrite true \
            --output none

          URL="https://${AZURE_STORAGE_ACCOUNT}.blob.core.windows.net/${FALLBACK_BLOB_CONTAINER}/${BLOB_NAME}"
          echo "Setting WEBSITE_RUN_FROM_PACKAGE to blob MI URL (no SAS)"
          az functionapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_FUNCTIONAPP_NAME" \
            --settings "WEBSITE_RUN_FROM_PACKAGE=$URL" \
            --output none

          echo "Waiting for app to download + reload (up to 180s)..."
          for i in $(seq 1 12); do
            sleep 15
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://${AZURE_FUNCTIONAPP_NAME}.azurewebsites.net/api/health" 2>/dev/null || echo "000")
            echo "t+$((i*15))s: /api/health = $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Fallback deploy succeeded"
              exit 0
            fi
          done
          echo "::error::Fallback deploy: /api/health did not return 200 within 180s"
          exit 1

      - name: Verify deploy outcome
        # Fails the job only if BOTH primary and fallback paths failed.
        if: always()
        run: |
          set -euo pipefail
          PRIMARY="${{ steps.primary_deploy.outcome }}"
          FALLBACK="${{ steps.fallback_deploy.outcome }}"
          echo "primary=$PRIMARY fallback=$FALLBACK"
          if [ "$PRIMARY" = "success" ]; then
            echo "Deploy succeeded via primary (config-zip)."
            exit 0
          fi
          if [ "$FALLBACK" = "success" ]; then
            echo "::warning::Deploy succeeded via blob MI fallback. WEBSITE_RUN_FROM_PACKAGE is on a blob URL — the next workflow run will auto-correct back to '1' once SCM is stable. Investigate SCM health."
            exit 0
          fi
          echo "::error::Both deploy paths failed."
          exit 1
