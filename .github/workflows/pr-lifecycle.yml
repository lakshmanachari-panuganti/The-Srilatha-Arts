name: PR Lifecycle

# Thin caller. The implementation lives in the administration repository so a fix
# reaches every repository at once.
# https://github.com/lakshmanachari-panuganti/Repository-Administration-Governance
#
# language: none deliberately. This repository already runs its own build, npm audit
# and static-export checks; duplicating them here would double the CI cost and prove
# nothing. The lifecycle contributes the promotion-path check, the agent guard and the
# ai-review gate.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted]

jobs:
  lifecycle:
    uses: lakshmanachari-panuganti/Repository-Administration-Governance/.github/workflows/pr-lifecycle.yml@main
    with:
      language: none
      test-command: ''
      enable-agents: false
    secrets: inherit
