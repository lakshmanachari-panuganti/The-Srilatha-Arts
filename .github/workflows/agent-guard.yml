name: agent-guard

# Required status check on develop. Enforces the invariants the agents are only
# *instructed* to follow, so a misbehaving or prompt-injected agent cannot merge.

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    name: ci/agent-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Run agent guard
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OWNER_LOGIN: ${{ github.repository_owner }}
        run: ./.github/scripts/Invoke-AgentGuard.ps1
