name: Deploy Backend · DEV

on:
  push:
    branches:
      - develop
      - ai-driven1
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend-dev.yml'
  pull_request:
    branches:
      - develop
      - ai-driven1
    paths:
      - 'backend/**'
  workflow_dispatch:

concurrency:
  group: deploy-backend-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  WORKING_DIRECTORY: backend
  AZURE_FUNCTIONAPP_NAME: func-thesrilathaarts-dev
  AZURE_RESOURCE_GROUP: rg-thesrilathaarts-dev

jobs:
  build-and-deploy:
    name: Build & Deploy BackEnd - Dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for azure/login OIDC token exchange

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          npm run build
          npm prune --omit=dev

      - name: Package backend as zip
        if: github.event_name != 'pull_request'
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: zip -r -q "$RUNNER_TEMP/deploy.zip" . -x ".git/*" ".github/*"

      - name: Azure login (OIDC)
        if: github.event_name != 'pull_request'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_DEV }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure RunFromPackage=1 (idempotent)
        # Belt-and-braces: assert local-mount mode so a stray Portal edit
        # can't silently flip us back to a SAS-URL value. No-op if already 1.
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          az functionapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_FUNCTIONAPP_NAME" \
            --settings "WEBSITE_RUN_FROM_PACKAGE=1" \
            --output none

      - name: Deploy to Azure Functions (OneDeploy via AAD/OIDC)
        # `az functionapp deploy --type zip` uses OneDeploy over AAD — no
        # SCM basic auth, no publish profile, no storage access from CI.
        # Requires the CI SP's `Website Contributor` role on this Function
        # App (granted in Deploy-Infrastructure-v2.ps1 §9.4). The runtime
        # mounts the zip locally per WEBSITE_RUN_FROM_PACKAGE=1.
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          az functionapp deploy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_FUNCTIONAPP_NAME" \
            --src-path "$RUNNER_TEMP/deploy.zip" \
            --type zip
          echo "Deploy succeeded"
