name: PR Lifecycle

# Thin caller. The implementation lives in the administration repository so a fix
# reaches every repository at once.
#
# language: none - this repo runs its own build, npm audit and static-export checks.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted]

jobs:
  lifecycle:
    uses: lakshmanachari-panuganti/Repository-Administration-Governance/.github/workflows/pr-lifecycle.yml@main
    with:
      language: none
      test-command: ''
      enable-agents: true
      # DELIBERATE HOLE - remove when the Next.js advisories clear.
      #
      # npm audit (frontend) fails on Next.js CVEs that every one of them requires a
      # running Next server to exploit: Server Actions, rewrites, the Image
      # Optimization API, Edge runtime, response-body caching. This frontend is
      # output: export with images.unoptimized, served as static files by Azure Static
      # Web Apps. There is no server, so none of them reach us.
      #
      # It still fails on every run, and once the verdict began treating failed checks
      # as blocking it stopped every pull request in this repository. Excluded until
      # Next 16 lands and the advisories clear, at which point DELETE THIS LINE and
      # let the check block again.
      ignore-checks: 'npm audit (frontend)'
    secrets: inherit
