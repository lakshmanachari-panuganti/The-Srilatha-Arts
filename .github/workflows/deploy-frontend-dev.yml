name: Deploy Frontend · DEV

on:
  push:
    branches:
      - develop
      - ai-driven1
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend-dev.yml'
  pull_request:
    branches:
      - develop
      - ai-driven1
    paths:
      - 'frontend/**'
  workflow_dispatch:
  # NOTE: no `schedule` trigger here on purpose. Scheduled workflows only run
  # from the default branch (main), so a cron on this DEV workflow would
  # deploy MAIN's frontend to the DEV Static Web App and drift DEV away from
  # the dev branch. The weekly pre-render/sitemap refresh lives on the PRD
  # workflow only; refresh DEV via workflow_dispatch or a dev-branch push.

concurrency:
  group: deploy-frontend-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  # Node 22 = current LTS ("Jod"). Node 20 entered Maintenance in Oct 2025.
  # See https://endoflife.date/nodejs
  NODE_VERSION: '22'
  WORKING_DIRECTORY: frontend
  API_BASE_URL: https://func-thesrilathaarts-dev.azurewebsites.net/api
  SITE_URL: https://delightful-mushroom-062e18100.7.azurestaticapps.net

jobs:
  build-and-deploy:
    name: Build & Deploy FrontEnd - Dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Type-check
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm run typecheck

      - name: Build (Next.js)
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ env.API_BASE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NODE_ENV: production
        run: npm run build

      # Wire the pre-rendered product pages into SWA routing. Explicit exact
      # routes (one per exported /product/<id>/ page) are injected ABOVE the
      # `/product/*` → shell wildcard; SWA evaluates routes top-down and
      # first match wins, so known products serve their real static HTML
      # (per-product OG tags) while unknown/new products still fall through
      # to the shell exactly as before. Runs against the checked-out working
      # copy only - the committed config is untouched.
      - name: Inject pre-rendered product routes
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: node scripts/inject-product-routes.mjs

      # Dev-only deindexing: robots.txt already disallows crawling on dev, but
      # an "X-Robots-Tag: noindex" response header is belt-and-braces — it also
      # deindexes anything already crawled and covers non-HTML assets. The SWA
      # action reads the routing config from `config_file_location` (frontend/),
      # so we inject the header into frontend/staticwebapp.config.json in the
      # checked-out working copy just before upload. The committed file and the
      # PRD workflow's headers are untouched.
      - name: Inject X-Robots-Tag noindex header (dev only)
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          node -e "
            const fs = require('fs');
            const p = 'staticwebapp.config.json';
            const cfg = JSON.parse(fs.readFileSync(p, 'utf8'));
            cfg.globalHeaders = { ...(cfg.globalHeaders || {}), 'X-Robots-Tag': 'noindex' };
            fs.writeFileSync(p, JSON.stringify(cfg, null, 2) + '\n');
            console.log('globalHeaders now:', Object.keys(cfg.globalHeaders).join(', '));
          "

      - name: Deploy to Azure Static Web Apps
        id: swa
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEV }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # When `skip_app_build: true`, the SWA action ignores `output_location`
          # and treats `app_location` itself as the artifact folder. So we point
          # straight at Next.js's static export output (`frontend/out/`).
          app_location: ${{ env.WORKING_DIRECTORY }}/out
          # The SWA routing config lives at frontend/staticwebapp.config.json,
          # outside the build output. Tell the action where to find it.
          config_file_location: ${{ env.WORKING_DIRECTORY }}
          skip_app_build: true
          skip_api_build: true
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ env.API_BASE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}

  close-preview:
    name: Close PR Preview (DEV)
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Close Preview
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEV }}
          action: close
