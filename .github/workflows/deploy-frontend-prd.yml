name: Deploy Frontend · PRD

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend-prd.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend-prd
  cancel-in-progress: false

env:
  # Node 22 = current LTS ("Jod"). Node 20 entered Maintenance in Oct 2025.
  # See https://endoflife.date/nodejs
  NODE_VERSION: '22'
  WORKING_DIRECTORY: frontend
  API_BASE_URL: https://func-thesrilathaarts-prd.azurewebsites.net/api
  SITE_URL: https://www.srilatha.art

jobs:
  build-and-deploy:
    name: Build & Deploy FrontEnd - Prd
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ env.SITE_URL }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
          lfs: false

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Type-check
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm run typecheck

      - name: Build (Next.js)
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ env.API_BASE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NODE_ENV: production
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PRD }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # When `skip_app_build: true`, the SWA action ignores `output_location`
          # and treats `app_location` itself as the artifact folder. So we point
          # straight at Next.js's static export output (`frontend/out/`).
          app_location: ${{ env.WORKING_DIRECTORY }}/out
          # The SWA routing config lives at frontend/staticwebapp.config.json,
          # outside the build output. Tell the action where to find it.
          config_file_location: ${{ env.WORKING_DIRECTORY }}
          skip_app_build: true
          skip_api_build: true
          production_branch: main
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ env.API_BASE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}
