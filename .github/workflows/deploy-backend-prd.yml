name: Deploy Backend · PRD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend-prd.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend-prd
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  WORKING_DIRECTORY: backend
  AZURE_FUNCTIONAPP_NAME: func-thesrilathaarts-prd
  AZURE_RESOURCE_GROUP: rg-thesrilathaarts-prd

jobs:
  build-and-deploy:
    name: Build & Deploy BackEnd - Prd
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      id-token: write   # required for azure/login OIDC token exchange

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          npm run build
          npm prune --omit=dev

      - name: Package backend as zip
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: zip -r -q "$RUNNER_TEMP/deploy.zip" . -x ".git/*" ".github/*"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_PRD }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure RunFromPackage=1 (idempotent)
        # Belt-and-braces: assert local-mount mode so a stray Portal edit
        # can't silently flip us back to a SAS-URL value. No-op if already 1.
        run: |
          set -euo pipefail
          az functionapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_FUNCTIONAPP_NAME" \
            --settings "WEBSITE_RUN_FROM_PACKAGE=1" \
            --output none

      - name: Deploy to Azure Functions (Kudu ZipDeploy via AAD/OIDC)
        # OneDeploy (`az functionapp deploy --type zip`) is not supported
        # on Linux Consumption plans and returns "This API isn't available
        # in this environment yet". `az functionapp deployment source
        # config-zip` uses the Kudu ZipDeploy endpoint which IS supported
        # on Linux Consumption and works over the AAD token from OIDC
        # login (no SCM basic auth, no publish profile). Requires the CI
        # SP's `Website Contributor` role on the Function App.
        run: |
          set -euo pipefail
          az functionapp deployment source config-zip \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_FUNCTIONAPP_NAME" \
            --src "$RUNNER_TEMP/deploy.zip"
          echo "Deploy succeeded"
