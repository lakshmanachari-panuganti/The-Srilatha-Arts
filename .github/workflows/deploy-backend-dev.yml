name: Deploy Backend · DEV

on:
  push:
    branches: [develop]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend-dev.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'backend/**'
  workflow_dispatch:

concurrency:
  group: deploy-backend-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  WORKING_DIRECTORY: backend
  AZURE_FUNCTIONAPP_NAME: func-thesrilathaarts-dev

jobs:
  build-and-deploy:
    name: Build & Deploy BackEnd - Dev
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          npm run build
          npm prune --omit=dev

      - name: Package backend as zip
        if: github.event_name != 'pull_request'
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: zip -r -q "$RUNNER_TEMP/deploy.zip" . -x ".git/*" ".github/*"

      - name: Deploy to Azure Functions (Kudu zipdeploy)
        # Replaces Azure/functions-action@v1 — GitHub disabled the action's
        # repo on 2026-06-05 after a supply-chain incident. We POST the zip
        # to Kudu's /api/zipdeploy endpoint directly, using the MSDeploy
        # credentials embedded in the publish profile.
        if: github.event_name != 'pull_request'
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE_DEV }}
          APP_NAME: ${{ env.AZURE_FUNCTIONAPP_NAME }}
        run: |
          set -euo pipefail
          user=$(echo "$PUBLISH_PROFILE" | xmllint --xpath 'string(//publishProfile[@publishMethod="MSDeploy"]/@userName)' -)
          pass=$(echo "$PUBLISH_PROFILE" | xmllint --xpath 'string(//publishProfile[@publishMethod="MSDeploy"]/@userPWD)' -)
          [ -n "$user" ] && [ -n "$pass" ] || { echo "Failed to parse MSDeploy creds from publish profile" >&2; exit 1; }
          curl -sS -fL --max-time 600 \
            -u "$user:$pass" \
            -H "Content-Type: application/zip" \
            --data-binary "@$RUNNER_TEMP/deploy.zip" \
            "https://${APP_NAME}.scm.azurewebsites.net/api/zipdeploy"
          echo "Deploy succeeded"
